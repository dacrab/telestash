org.gradle.jvmargs=-Xmx3g -Xms1g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# Single-module build: an in-process Kotlin compiler beats paying for a Kotlin
# daemon's startup and its own heap.
kotlin.compiler.execution.strategy=in-process
