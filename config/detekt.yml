# Detekt config tailored to this codebase.
# Only deviations from detekt defaults that are actually load-bearing.

complexity:
  LongMethod:
    # Largest composables (SettingsDialog) sit around 100 lines; splitting
    # them further would hurt readability more than help.
    threshold: 120
  LongParameterList:
    # Composables legitimately take many callbacks (TopBars has 14);
    # bundling them into wrapper objects would add noise, not clarity.
    active: false
  TooManyFunctions:
    # AppViewModel is the single ViewModel for the whole app by design.
    active: false

style:
  ReturnCount:
    # Early-return chains in TDLib error/state handling are clearer than nesting.
    active: false

naming:
  FunctionNaming:
    # Composable funs are PascalCase by official convention.
    ignoreAnnotated: [ 'Composable' ]

exceptions:
  TooGenericExceptionCaught:
    # TDLib/MediaStore calls fail with varied exception types; broad catches at
    # per-item boundaries are intentional so one bad file can't kill a batch.
    active: false
