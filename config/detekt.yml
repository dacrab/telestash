# Detekt config tailored to this codebase.
# Only deviations from detekt defaults that are actually load-bearing.

complexity:
  LongMethod:
    allowedLines: 120
  LongParameterList:
    active: false
  TooManyFunctions:
    allowedFunctionsPerFile: 30
    allowedFunctionsPerClass: 50
    allowedFunctionsPerInterface: 30
    allowedFunctionsPerObject: 20
    allowedFunctionsPerEnum: 10

style:
  ReturnCount:
    max: 6
    excludeGuardClauses: true

naming:
  FunctionNaming:
    # Composable funs are PascalCase by official convention.
    ignoreAnnotated: [ 'Composable' ]

exceptions:
  TooGenericExceptionCaught:
    # TDLib/MediaStore calls fail with varied exception types; broad catches at
    # per-item boundaries are intentional so one bad file can't kill a batch.
    active: false
