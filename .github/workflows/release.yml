name: Release
on:
  push:
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
        continue-on-error: true

      - name: Build release APK
        run: |
          if [ -f "$GITHUB_WORKSPACE/release.keystore" ]; then
            export KEYSTORE_FILE="$GITHUB_WORKSPACE/release.keystore"
            export KEYSTORE_PASSWORD="${{ secrets.KEYSTORE_PASSWORD }}"
            export KEY_ALIAS="${{ secrets.KEY_ALIAS }}"
            export KEY_PASSWORD="${{ secrets.KEY_PASSWORD }}"
          fi
          ./gradlew ktlintCheck detekt lintRelease assembleRelease

      - name: Rename APK with version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          mv app/build/outputs/apk/release/app-release.apk "telestash-${VERSION}.apk"

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: telestash-*.apk
          generate_release_notes: true
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          body: |
            ## Installation

            Download the APK and install it on your Android phone
            (enable "install from unknown sources" if asked).

            > APKs are signed with the CI key unless release secrets are configured.
            > Verify you trust the source before installing.
