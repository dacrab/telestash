name: Release
on:
  push:
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      # Tag runs are rare, so they may write their own cache entry rather than
      # depending on main's entry still being present.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: false
          cache-cleanup: always

      - name: Validate signing secrets and decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [[ -n "${!v}" ]] || { printf '::error::%s is required\n' "$v"; exit 1; }
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          [[ -s "$RUNNER_TEMP/release.keystore" ]] || { printf '%s\n' '::error::The decoded keystore is empty'; exit 1; }

      - name: Lint, test and build release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          RELEASE_TAG: ${{ github.ref_name }}
        # `lint` already aggregates the release variant, and the unit tests are
        # variant-agnostic, so lintRelease/test would only repeat work.
        run: ./gradlew ktlintCheck detekt lint testDebugUnitTest assembleRelease -PreleaseTag="$RELEASE_TAG" -PsignRelease=true

      # One APK per ABI, each ~20-30 MB instead of the ~95 MB universal build.
      # The script fails rather than silently attaching nothing to the release.
      - name: Name the per-ABI APKs
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          built=0
          for apk in app/build/outputs/apk/release/app-*-release.apk; do
            abi=${apk#*app-}; abi=${abi%-release.apk}
            [[ "$abi" == "universal" ]] && abi=""
            suffix=${abi:+-$abi}
            mv "$apk" "telestash-${RELEASE_TAG#v}${suffix}.apk"
            built=$((built + 1))
          done
          [[ "$built" -gt 0 ]] || { printf '%s\n' '::error::No release APKs were produced'; exit 1; }
          printf 'Named %d APK(s)\n' "$built"
          ls -la telestash-*.apk

      # A failed upload is retried with continue-on-error: a transient GitHub
      # error should not leave a pushed tag looking like a broken release.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: telestash-*.apk
          body_path: .github/release-notes.md
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
