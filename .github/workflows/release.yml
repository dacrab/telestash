name: Release
on:
  push:
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      # Tag runs are rare, so they may write their own cache entry rather than
      # depending on main's entry still being present.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: false
          cache-cleanup: always

      - name: Validate signing secrets and decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [[ -n "${!v}" ]] || { printf '::error::%s is required\n' "$v"; exit 1; }
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          [[ -s "$RUNNER_TEMP/release.keystore" ]] || { printf '%s\n' '::error::The decoded keystore is empty'; exit 1; }

      # Refuse to publish a tag that CHANGELOG.md does not describe, so the
      # changelog cannot drift behind the releases. Needs full history to see
      # every tag; the default shallow clone would not.
      - name: Validate the changelog entry for this tag
        run: |
          git fetch --force --tags --unshallow 2>/dev/null || git fetch --force --tags
          bash scripts/check-changelog.sh --tag "$GITHUB_REF_NAME"

      - name: Lint, test and build release and debug APKs
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          RELEASE_TAG: ${{ github.ref_name }}
        # `lint` already aggregates the release variant, and the unit tests are
        # variant-agnostic, so lintRelease/test would only repeat work.
        run: ./gradlew ktlintCheck detekt lint testDebugUnitTest assembleDebug assembleRelease -PreleaseTag="$RELEASE_TAG" -PsignRelease=true

      # One APK per ABI for both variants. Fails rather than silently attaching
      # nothing to the release.
      - name: Name the per-ABI APKs
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          v=${RELEASE_TAG#v}
          built=0
          for apk in app/build/outputs/apk/release/app-*-release.apk; do
            abi=${apk#*app-}; abi=${abi%-release.apk}
            [[ "$abi" == "universal" ]] && abi=""
            suffix=${abi:+-$abi}
            mv "$apk" "telestash-${v}${suffix}.apk"
            built=$((built + 1))
          done
          for apk in app/build/outputs/apk/debug/app-*-debug.apk; do
            abi=${apk#*app-}; abi=${abi%-debug.apk}
            [[ "$abi" == "universal" ]] && abi=""
            suffix=${abi:+-$abi}
            mv "$apk" "telestash-${v}${suffix}-debug.apk"
            built=$((built + 1))
          done
          [[ "$built" -gt 0 ]] || { printf '%s\n' '::error::No APKs were produced'; exit 1; }
          printf 'Named %d APK(s)\n' "$built"
          ls -la telestash-*.apk

      # Users can update between the two builds only if the signer matches, and a
      # published debug APK must never be debuggable.
      - name: Verify APK signing and debug flags
        run: |
          set -euo pipefail
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          AAPT2=$(dirname "$APKSIGNER")/aapt2
          release_apk=$(ls telestash-*.apk | grep -v -- '-debug\.apk$' | head -1)
          debug_apk=$(ls telestash-*-debug.apk | head -1)

          "$APKSIGNER" verify --print-certs "$release_apk" | grep -i 'certificate SHA-256 digest' > /tmp/rel.txt
          "$APKSIGNER" verify --print-certs "$debug_apk" | grep -i 'certificate SHA-256 digest' > /tmp/dbg.txt
          diff -q /tmp/rel.txt /tmp/dbg.txt >/dev/null ||
            { printf '%s\n' '::error::Release and debug APKs are signed by different keys'; exit 1; }

          if "$AAPT2" dump badging "$debug_apk" | grep -q 'application-debuggable'; then
            printf '%s\n' '::error::Published debug APK is still debuggable'; exit 1
          fi
          printf 'Signer matches; %s is not debuggable\n' "$(basename "$debug_apk")"

      # A failed upload is retried with continue-on-error: a transient GitHub
      # error should not leave a pushed tag looking like a broken release.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: telestash-*.apk
          body_path: .github/release-notes.md
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
