name: Release
on:
  push:
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Validate signing secrets and decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$KEYSTORE_BASE64" ]] || { printf '%s\n' '::error::KEYSTORE_BASE64 is required'; exit 1; }
          [[ -n "$KEYSTORE_PASSWORD" ]] || { printf '%s\n' '::error::KEYSTORE_PASSWORD is required'; exit 1; }
          [[ -n "$KEY_ALIAS" ]] || { printf '%s\n' '::error::KEY_ALIAS is required'; exit 1; }
          [[ -n "$KEY_PASSWORD" ]] || { printf '%s\n' '::error::KEY_PASSWORD is required'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          [[ -s "$RUNNER_TEMP/release.keystore" ]] || { printf '%s\n' '::error::The decoded keystore is empty'; exit 1; }

      - name: Lint and build release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./gradlew ktlintCheck detekt lintRelease test assembleRelease -PreleaseTag="$RELEASE_TAG" -PsignRelease=true

      - name: Rename APK
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: mv app/build/outputs/apk/release/app-release.apk "telestash-${RELEASE_TAG#v}.apk"

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: telestash-*.apk
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          body: |
            ## Installation

            Download the APK and install it on your Android phone
            (enable "install from unknown sources" if asked).

            > This APK is signed with the project release key.
            > Verify you trust the source before installing.
