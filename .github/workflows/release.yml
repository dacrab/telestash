name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@67621b124fd2e251c5e8a0e6e3b91318f2287669 # v6.3.0

      - name: Decode signing keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: Lint and build release APK
        run: ./gradlew ktlintCheck detekt lintRelease assembleRelease
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_BASE64 != '' && 'release.keystore' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APK with version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          mv app/build/outputs/apk/release/app-release.apk "telestash-${VERSION}.apk"

      - uses: softprops/action-gh-release@e598afbe1493e6b1bafb1f389cabb956eab91231 # v3.0.3
        with:
          files: telestash-*.apk
          generate_release_notes: true
          prerelease: ${{ !contains(github.ref_name, '.0') || startsWith(github.ref_name, 'v0.') }}
          body: |
            ## Installation

            Download `telestash-${GITHUB_REF#refs/tags/v}.apk` and install it on your
            Android phone (enable "install from unknown sources" if asked).

            > This build is signed with the debug/release key from CI. Verify you trust
            > the source before installing.
