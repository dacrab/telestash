name: CI

on:
  push:
    branches: [main, "renovate/**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      # Only main writes the Gradle caches. Enhanced caching stores ~1.5 GB of
      # dependencies/transforms per branch, and every PR or Renovate branch used
      # to write its own full copy, which blew the 500 MB Actions storage quota.
      # Runs off main restore that entry read-only instead.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          # Runs build a release APK too, so keep this side of the cache lean.
          cache-cleanup: always

      # One invocation: the configuration cache and daemon are reused, so
      # separate steps would only re-pay startup and dependency resolution.
      - name: Lint, test and build
        run: ./gradlew ktlintCheck detekt lintDebug testDebugUnitTest assembleDebug assembleRelease

      # ABI splits apply to debug too, so pick the arm64 build (~48 MB) rather
      # than the ~117 MB universal one; it's what a real phone or emulator needs.
      # Convenience only, so a storage-quota failure must not red-X a green build.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: telestash-debug-apk
          path: app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          if-no-files-found: error
          retention-days: 1
