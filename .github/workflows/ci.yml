name: CI

on:
  push:
    branches: [main, "renovate/**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: false

      - name: Lint (ktlint + detekt)
        run: ./gradlew ktlintCheck detekt

      - name: Android lint
        run: ./gradlew lintDebug

      - name: Unit tests
        run: ./gradlew test

      - name: Build debug and minified release
        run: ./gradlew assembleDebug assembleRelease

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: telestash-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          # Debug APKs are ~115 MB and the free artifact quota is 500 MB,
          # so keep only ~1 day's worth around.
          retention-days: 1
